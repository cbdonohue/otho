[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otho"
version = "0.1.0"
description = "Otho — a fantasy-football analysis operating system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Otho" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
]

[project.entry-points."otho.plugins"]
matchup = "app.plugins.builtin.matchup.plugin:MatchupSimulatorPlugin"
lineup = "app.plugins.builtin.lineup.plugin:LineupPlugin"
waiver_wire = "app.plugins.builtin.waiver_wire.plugin:WaiverWirePlugin"
roster_health = "app.plugins.builtin.roster_health.plugin:RosterHealthPlugin"
opponent_scout = "app.plugins.builtin.opponent_scout.plugin:OpponentScoutPlugin"
league_activity = "app.plugins.builtin.league_activity.plugin:LeagueActivityPlugin"
injury_watch = "app.plugins.builtin.injury_watch.plugin:InjuryWatchPlugin"
trade_finder = "app.plugins.builtin.trade_finder.plugin:TradeFinderPlugin"
playoff_odds = "app.plugins.builtin.playoff_odds.plugin:PlayoffOddsPlugin"

[project.scripts]
otho = "app.main:run"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
